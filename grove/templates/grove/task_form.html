{% extends "base.html" %}
{% block title %}Create field task · Grove{% endblock %}
{% block content %}
<main class="grove-shell grove-form-shell"><p class="eyebrow"><a href="{% url 'grove:dashboard' org.slug %}">{{ org.name }}</a> · field team</p><h1>Assign a field task</h1>
  <form method="post" class="grove-form">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label class="grove-field"><span>{{ field.label }}</span>{{ field }}{{ field.errors }}</label>{% endfor %}<button class="primary-action" type="submit">Assign task</button></form>
</main>
{% endblock %}
