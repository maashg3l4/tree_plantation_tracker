{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}Tree Plantation Tracker{% endblock %}</title>
    <script>
        (function () {
            const preference = localStorage.getItem('theme');
            const dark = preference ? preference === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.classList.toggle('dark', dark);
        }());
    </script>
    <link href="{% static 'trees/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'trees/custom-overrides.css' %}" rel="stylesheet">
    <link href="{% static 'trees/app.css' %}" rel="stylesheet">
</head>
<body>
<svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-planted" viewBox="0 0 24 24"><path d="M12 20v-8m0 2c-4.5 0-7-2.5-7-7 4.5 0 7 2.5 7 7Zm0-3c0-4.5 2.5-7 7-7 0 4.5-2.5 7-7 7Z"/></symbol>
    <symbol id="icon-inspiring" viewBox="0 0 24 24"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Zm7 12 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15ZM5 3l.8 1.7L7.5 5.5l-1.7.8L5 8l-.8-1.7-1.7-.8 1.7-.8L5 3Z"/></symbol>
    <symbol id="icon-care" viewBox="0 0 24 24"><path d="M20.8 8.8c0 5.2-8.8 11-8.8 11s-8.8-5.8-8.8-11A4.8 4.8 0 0 1 12 6.1a4.8 4.8 0 0 1 8.8 2.7Z"/><path d="M8 12h2l1.2-2.2L13 15l1.2-3H16"/></symbol>
    <symbol id="icon-help" viewBox="0 0 24 24"><path d="m14.7 6.3 3-3 3 3-3 3m-1-2L8 16l-3-3 8.7-8.7M4 20l4-1-3-3-1 4Zm12-5 4 4"/></symbol>
    <symbol id="icon-insight" viewBox="0 0 24 24"><path d="M3 3v18h18M7 14l4-4 3 3 6-7"/><path d="M16 6h4v4"/></symbol>
</svg>

<nav class="site-nav">
    <div class="site-nav-inner">
        <a class="site-brand" href="{% url 'tree_list' %}">
            <svg class="brand-icon" aria-hidden="true"><use href="#icon-planted"></use></svg>
            Tree Plantation Tracker
        </a>
        <div class="site-nav-actions">
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch color theme" aria-pressed="false">
                <span aria-hidden="true">◐</span><span class="theme-label">Theme</span>
            </button>
            {% if user.is_authenticated %}
                <span class="nav-greeting">Hi, {{ user.username }}</span>
                <a href="{% url 'profile' %}" class="nav-link">Profile</a>
                <a href="{% url 'logout' %}" class="nav-link nav-link-accent">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="nav-link">Login</a>
                <a href="{% url 'register' %}" class="nav-link nav-link-accent">Join</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="page-container">
    {% block content %}{% endblock %}
</div>
<script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
<script src="{% static 'trees/app.js' %}" defer></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js" defer></script>
<script>
    (function () {
        const toggle = document.getElementById('theme-toggle');
        if (!toggle) return;
        const updateTheme = (dark) => {
            document.documentElement.classList.toggle('dark', dark);
            toggle.setAttribute('aria-pressed', String(dark));
            toggle.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
        };
        updateTheme(document.documentElement.classList.contains('dark'));
        toggle.addEventListener('click', () => {
            const dark = !document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', dark ? 'dark' : 'light');
            updateTheme(dark);
        });
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (event) => {
            if (!localStorage.getItem('theme')) updateTheme(event.matches);
        });
    }());
</script>
</body>
</html>
